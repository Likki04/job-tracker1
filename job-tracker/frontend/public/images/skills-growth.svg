<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" fill="none">
  <defs>
    <radialGradient id="sgGlow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow2" cx="50%" cy="50%" r="50%">
      <stop stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="resumeGrad" x1="50" y1="30" x2="160" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#6366f1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="110" cy="110" r="95" fill="url(#sgGlow)"/>
  <circle cx="280" cy="110" r="90" fill="url(#cyanGlow2)"/>

  <!-- Resume Sheet -->
  <g transform="translate(45, 20)" filter="url(#cardShadow)">
    <rect width="115" height="155" rx="14" fill="url(#resumeGrad)" stroke="#818cf8" stroke-width="2"/>
    <!-- Fold corner -->
    <path d="M 85 0 L 115 30 L 85 30 Z" fill="#c7d2fe"/>

    <!-- Avatar circle -->
    <circle cx="34" cy="34" r="14" fill="#6366f1"/>
    <circle cx="34" cy="30" r="5" fill="#ffffff"/>
    <path d="M 25 42 C 25 38 29 36 34 36 C 39 36 43 38 43 42 Z" fill="#ffffff"/>

    <rect x="56" y="24" width="46" height="8" rx="4" fill="#1e1b4b"/>
    <rect x="56" y="36" width="34" height="6" rx="3" fill="#6366f1"/>

    <!-- Lines -->
    <line x1="20" y1="62" x2="95" y2="62" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="74" x2="88" y2="74" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="86" x2="98" y2="86" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Mini Skill Tags on Resume -->
    <rect x="20" y="102" width="34" height="14" rx="7" fill="#818cf8"/>
    <text x="26" y="112" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">React</text>

    <rect x="58" y="102" width="38" height="14" rx="7" fill="#38bdf8"/>
    <text x="64" y="112" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">Python</text>

    <rect x="20" y="122" width="44" height="14" rx="7" fill="#10b981"/>
    <text x="26" y="132" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">Docker</text>

    <!-- Verified Badge -->
    <circle cx="100" cy="140" r="14" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <path d="M 94 140 L 98 144 L 106 136" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Skill Match Dial / Circle Card -->
  <g transform="translate(195, 30)" filter="url(#cardShadow)">
    <rect width="145" height="140" rx="18" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>

    <!-- Circular Progress Gauge -->
    <circle cx="72" cy="65" r="42" stroke="#312e81" stroke-width="9" fill="none"/>
    <circle cx="72" cy="65" r="42" stroke="#10b981" stroke-width="9" stroke-dasharray="264" stroke-dashoffset="40" stroke-linecap="round" fill="none" transform="rotate(-90 72 65)"/>

    <text x="72" y="65" font-family="sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">92%</text>
    <text x="72" y="82" font-family="sans-serif" font-size="9" font-weight="bold" fill="#34d399" text-anchor="middle">SKILL MATCH</text>

    <!-- Bottom summary -->
    <rect x="18" y="106" width="109" height="20" rx="10" fill="rgba(99, 102, 241, 0.25)" stroke="#6366f1" stroke-width="1"/>
    <text x="72" y="119" font-family="sans-serif" font-size="9" font-weight="bold" fill="#c7d2fe" text-anchor="middle">AI Resume Analyzer</text>
  </g>

  <!-- Floating Floating Skill Pill Nodes -->
  <g transform="translate(140, 16)" filter="url(#cardShadow)">
    <rect width="58" height="24" rx="12" fill="#ec4899"/>
    <text x="29" y="16" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">AWS</text>
  </g>

  <g transform="translate(150, 172)" filter="url(#cardShadow)">
    <rect width="78" height="26" rx="13" fill="#f59e0b"/>
    <text x="39" y="17" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">TypeScript</text>
  </g>

  <g transform="translate(290, 170)" filter="url(#cardShadow)">
    <rect width="64" height="24" rx="12" fill="#06b6d4"/>
    <text x="32" y="16" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">GraphQL</text>
  </g>

  <!-- Connective Dots -->
  <circle cx="160" cy="80" r="3" fill="#818cf8"/>
  <circle cx="180" cy="120" r="3" fill="#34d399"/>
  <line x1="160" y1="80" x2="195" y2="70" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="150" y1="130" x2="180" y2="120" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3"/>
</svg>
