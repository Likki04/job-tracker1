<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" fill="none">
  <defs>
    <!-- Background and Glows -->
    <linearGradient id="bgPlate" x1="0" y1="0" x2="420" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Laptop Gradients -->
    <linearGradient id="laptopLid" x1="110" y1="70" x2="270" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="120" y1="80" x2="260" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090d16"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Rocket Gradients -->
    <linearGradient id="rocketBody" x1="280" y1="40" x2="350" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="rocketNose" x1="330" y1="30" x2="360" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="270" y1="120" x2="240" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f59e0b"/>
      <stop offset="0.6" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad1" x1="30" y1="50" x2="130" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e0e7ff" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="290" y1="140" x2="390" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#312e81" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Dropshadows -->
    <filter id="shadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.3"/>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient background glow spots -->
  <circle cx="90" cy="80" r="90" fill="url(#sunGlow)"/>
  <circle cx="340" cy="180" r="110" fill="url(#cyanGlow)"/>

  <!-- Back decorative grid / orbit lines -->
  <path d="M 40 180 C 120 220 280 230 380 140" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 6" stroke-opacity="0.35"/>
  <path d="M 60 70 C 160 20 280 40 370 100" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 6" stroke-opacity="0.35"/>

  <!-- Left Floating Card: Resume / Applied -->
  <g transform="translate(18, 50)" filter="url(#shadowLg)">
    <rect width="105" height="110" rx="14" fill="url(#cardGrad1)" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="28" cy="26" r="10" fill="#6366f1"/>
    <path d="M 24 26 L 27 29 L 32 23" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="46" y="22" width="44" height="8" rx="4" fill="#6366f1"/>
    <rect x="18" y="48" width="70" height="5" rx="2.5" fill="#a5b4fc"/>
    <rect x="18" y="60" width="56" height="5" rx="2.5" fill="#c7d2fe"/>
    <rect x="18" y="72" width="64" height="5" rx="2.5" fill="#c7d2fe"/>
    <rect x="18" y="88" width="38" height="12" rx="6" fill="#10b981"/>
    <text x="23" y="97" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff">OFFER</text>
  </g>

  <!-- Central Laptop Mockup -->
  <!-- Laptop Base Shadow -->
  <ellipse cx="205" cy="216" rx="95" ry="12" fill="#000000" fill-opacity="0.25" filter="url(#shadowLg)"/>

  <!-- Laptop Screen Outer -->
  <rect x="120" y="74" width="170" height="114" rx="12" fill="url(#laptopLid)" stroke="#6366f1" stroke-width="2"/>
  <!-- Laptop Inner Display -->
  <rect x="128" y="82" width="154" height="98" rx="6" fill="url(#screenGrad)"/>

  <!-- Laptop Screen Dashboard UI -->
  <circle cx="138" cy="92" r="3" fill="#f43f5e"/>
  <circle cx="147" cy="92" r="3" fill="#fbbf24"/>
  <circle cx="156" cy="92" r="3" fill="#10b981"/>
  <line x1="168" y1="92" x2="210" y2="92" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

  <!-- Bar Chart on Laptop Screen -->
  <rect x="140" y="146" width="12" height="24" rx="3" fill="#6366f1"/>
  <rect x="158" y="132" width="12" height="38" rx="3" fill="#8b5cf6"/>
  <rect x="176" y="118" width="12" height="52" rx="3" fill="#ec4899"/>
  <rect x="194" y="128" width="12" height="42" rx="3" fill="#06b6d4"/>
  <rect x="212" y="112" width="12" height="58" rx="3" fill="#10b981"/>
  <rect x="230" y="122" width="12" height="48" rx="3" fill="#f59e0b"/>
  <rect x="248" y="138" width="12" height="32" rx="3" fill="#818cf8"/>

  <!-- Mini trend line on screen -->
  <path d="M 146 140 Q 182 100 218 108 T 254 116" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="218" cy="108" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Laptop Base / Keyboard Deck -->
  <path d="M 96 188 L 314 188 L 328 206 C 328 210 324 213 320 213 L 90 213 C 86 213 82 210 82 206 Z" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <rect x="180" y="190" width="50" height="4" rx="2" fill="#64748b"/>
  <rect x="175" y="196" width="60" height="12" rx="3" fill="#1e293b"/>

  <!-- Career Advancement Rocket (Blasting Up Right) -->
  <g transform="translate(20, -10)">
    <!-- Exhaust Flame -->
    <path d="M 276 136 C 265 158 244 185 240 200 C 255 188 275 168 288 152 Z" fill="url(#flameGrad)" opacity="0.9"/>
    <path d="M 280 138 C 274 150 262 165 258 178 C 268 168 280 156 288 148 Z" fill="#fde047"/>

    <!-- Rocket Body -->
    <path d="M 326 62 C 326 62 300 85 284 114 C 278 126 282 136 294 134 C 322 120 348 94 348 94 L 326 62 Z" fill="url(#rocketBody)" stroke="#94a3b8" stroke-width="1"/>

    <!-- Rocket Nosecone -->
    <path d="M 326 62 L 348 94 C 354 84 362 68 365 52 C 349 55 334 60 326 62 Z" fill="url(#rocketNose)"/>

    <!-- Rocket Wing Left -->
    <path d="M 284 114 L 268 126 C 266 134 274 138 282 134 Z" fill="#f43f5e"/>
    <!-- Rocket Wing Right -->
    <path d="M 330 106 L 348 120 C 352 114 348 104 342 100 Z" fill="#e11d48"/>

    <!-- Rocket Window -->
    <circle cx="320" cy="90" r="7" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="322" cy="88" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Right Floating Card: Interview Scheduled -->
  <g transform="translate(290, 136)" filter="url(#shadowLg)">
    <rect width="112" height="74" rx="14" fill="url(#cardGrad2)" stroke="#818cf8" stroke-width="1.5"/>
    <!-- Video / Calendar Icon -->
    <rect x="14" y="14" width="22" height="20" rx="6" fill="#f59e0b"/>
    <path d="M 36 20 L 44 15 L 44 33 L 36 28 Z" fill="#f59e0b"/>
    <circle cx="25" cy="24" r="4" fill="#ffffff"/>

    <text x="48" y="24" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Interview</text>
    <text x="48" y="35" font-family="sans-serif" font-size="8" fill="#a5b4fc">Tomorrow, 2:00 PM</text>

    <!-- Status pill -->
    <rect x="14" y="44" width="84" height="18" rx="9" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981" stroke-width="1"/>
    <circle cx="24" cy="53" r="3" fill="#10b981"/>
    <text x="32" y="56" font-family="sans-serif" font-size="8" font-weight="bold" fill="#34d399">Round 2 • Tech</text>
  </g>

  <!-- Golden Trophy Star -->
  <g transform="translate(56, 175)" filter="url(#shadowLg)">
    <circle cx="20" cy="20" r="18" fill="linear-gradient(135deg, #f59e0b, #d97706)" stroke="#fbbf24" stroke-width="1.5"/>
    <path d="M 12 14 H 28 V 22 C 28 26 24 29 20 29 C 16 29 12 26 12 22 Z" fill="#fef08a"/>
    <path d="M 12 17 H 9 C 8 17 7 18 7 19 V 20 C 7 22 9 24 11 24 H 12" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 28 17 H 31 C 32 17 33 18 33 19 V 20 C 33 22 31 24 29 24 H 28" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 20 29 V 33 M 16 33 H 24" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Sparkle Stars -->
  <path d="M 130 40 L 133 46 L 139 48 L 133 50 L 130 56 L 127 50 L 121 48 L 127 46 Z" fill="#ec4899"/>
  <path d="M 390 70 L 392 74 L 396 75 L 392 77 L 390 81 L 388 77 L 384 75 L 388 74 Z" fill="#f59e0b"/>
  <path d="M 220 32 L 222 36 L 226 37 L 222 39 L 220 43 L 217 39 L 214 37 L 217 36 Z" fill="#38bdf8"/>
</svg>
